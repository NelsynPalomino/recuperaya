# Pipeline de RecuperaYa: integración continua (pruebas) y despliegue continuo (InfinityFree por FTP).
# Los datos sensibles se guardan como "Secrets" del repositorio (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, APP_KEY, APP_URL, DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD
name: CI/CD RecuperaYa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    name: 1-4 Integración, construcción y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, pdo_sqlite, zip, fileinfo
          coverage: pcov
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Ejecutar PHPUnit (unitarias, integración, caja blanca y caja negra)
        run: php artisan test --coverage-clover coverage.xml --log-junit phpunit-resultado.xml
      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            phpunit-resultado.xml
            coverage.xml

  despliegue:
    name: 6-7 Despliegue y verificación
    needs: pruebas
    runs-on: ubuntu-latest
    # Se activa cuando el hosting está configurado: variable del repositorio DESPLEGAR = si
    # (Settings > Secrets and variables > Actions > Variables). Mientras tanto el despliegue se omite.
    if: github.ref == 'refs/heads/main' && vars.DESPLEGAR == 'si'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Construir versión de producción
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
      - name: Crear .env de producción desde los Secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cat > .env <<EOF
          APP_NAME=RecuperaYa
          APP_ENV=production
          APP_DEBUG=false
          APP_KEY=${APP_KEY}
          APP_URL=${APP_URL}
          APP_LOCALE=es
          LOG_CHANNEL=single
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=${DB_HOST}
          DB_PORT=3306
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD="${DB_PASSWORD}"
          SESSION_DRIVER=database
          CACHE_STORE=database
          QUEUE_CONNECTION=sync
          MAIL_MAILER=log
          PUBLIC_DISK_PATH=public/storage
          EOF
      - name: Preparar archivos para el hosting
        run: |
          cp deploy/htaccess-raiz .htaccess
          rm -f public/storage
          mkdir -p public/storage
          cp -r storage/app/public/. public/storage/
          # Las carpetas vacías solo tienen .gitignore (excluido del FTP): se crean con un archivo para que existan en el hosting
          for d in storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache; do
            mkdir -p "$d" && touch "$d/index.html"
          done
      - name: Subir al hosting por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            cypress/**
            docs/**
            deploy/**
            docker/**
            Dockerfile
            docker-compose.yml
            .env.example
            phpunit.xml
            cypress.config.js
            sonar-project.properties
            package*.json
      - name: Verificar que la aplicación responde
        run: |
          sleep 20
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "${{ secrets.APP_URL }}/login" || true
