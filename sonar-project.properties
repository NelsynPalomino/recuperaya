# Configuración del análisis estático con SonarQube (servidor local http://localhost:9000)
# Ejecutar desde la raíz del proyecto:  sonar-scanner -Dsonar.token=<token>
sonar.projectKey=recuperaya
sonar.projectName=RecuperaYa - Objetos perdidos y encontrados
sonar.projectVersion=2.1
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Código fuente propio del proyecto
sonar.sources=app,routes,resources/views,database,config,public/css
sonar.tests=tests,cypress
sonar.test.inclusions=tests/**/*.php,cypress/**/*.js

# Se excluyen dependencias de terceros y archivos generados
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**,**/*.bak_*,database/*.sqlite
sonar.php.file.suffixes=php
